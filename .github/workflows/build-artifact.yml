name: Build production artifact

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Linux ${{ matrix.arch }} bundle
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Run tests
        run: pnpm test

      - name: Typecheck both apps
        run: pnpm typecheck

      - name: Build production server
        run: pnpm build
        env:
          NITRO_PRESET: node-server

      - name: Smoke test standalone codemode runtime
        run: |
          # Move outside the checkout so missing dependencies cannot fall back to pnpm.
          SMOKE_DIR=$(mktemp -d)
          trap 'mv "$SMOKE_DIR/api/.output" apps/api/.output; mv "$SMOKE_DIR/web/.output" apps/web/.output; rm -rf "$SMOKE_DIR"' EXIT
          mkdir -p "$SMOKE_DIR/api" "$SMOKE_DIR/web"
          mv apps/api/.output "$SMOKE_DIR/api/.output"
          mv apps/web/.output "$SMOKE_DIR/web/.output"
          node scripts/smoke-codemode.mjs "$SMOKE_DIR/api/.output"
          node scripts/smoke-apps.mjs "$SMOKE_DIR"

      # Archive first to preserve hidden files, symlinks, and executable bits.
      - name: Package production bundle
        run: |
          for APP in web api; do
            tar -czf pi-simple-$APP-linux-${{ matrix.arch }}.tar.gz -C apps/$APP .output
          done

      - name: Upload production bundle
        uses: actions/upload-artifact@v4
        with:
          name: pi-simple-web-linux-${{ matrix.arch }}
          path: pi-simple-*-linux-${{ matrix.arch }}.tar.gz
          if-no-files-found: error
          retention-days: 30
